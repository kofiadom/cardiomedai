sources:
  my-sql-db:
    kind: "postgres"
    host: "${DB_HOST}"
    database: "${DB_NAME}"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    port: 5432

tools:
  get_user_profile:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get the user's health profile including target BP, medical conditions, and medications"
    statement: "SELECT * FROM users WHERE id = $1"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get profile for"

  get_bp_history:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get user's blood pressure history with notes, ordered by date"
    statement: "SELECT systolic, diastolic, pulse, reading_time, notes FROM blood_pressure_readings WHERE user_id = $1 ORDER BY reading_time DESC LIMIT 20"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get BP history for"

  get_recent_bp_readings:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get the most recent blood pressure readings for trend analysis"
    statement: "SELECT systolic, diastolic, pulse, reading_time FROM blood_pressure_readings WHERE user_id = $1 ORDER BY reading_time DESC LIMIT 5"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get recent BP readings for"

  get_medication_reminders:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get all medication reminders for the user"
    statement: "SELECT * FROM medication_reminders WHERE user_id = $1 ORDER BY schedule_datetime"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get medication reminders for"

  get_pending_medication_reminders:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get pending (not taken) medication reminders"
    statement: "SELECT * FROM medication_reminders WHERE user_id = $1 AND is_taken = false ORDER BY schedule_datetime"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get pending medication reminders for"

  get_bp_check_reminders:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get blood pressure check reminders for the user"
    statement: "SELECT * FROM bp_check_reminders WHERE user_id = $1 ORDER BY reminder_datetime"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get BP check reminders for"

  get_pending_bp_check_reminders:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get pending (not completed) BP check reminders"
    statement: "SELECT * FROM bp_check_reminders WHERE user_id = $1 AND is_completed = false ORDER BY reminder_datetime"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get pending BP check reminders for"

  get_doctor_appointment_reminders:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get doctor appointment reminders for the user"
    statement: "SELECT * FROM doctor_appointment_reminders WHERE user_id = $1 ORDER BY appointment_datetime"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get doctor appointment reminders for"

  get_upcoming_doctor_appointments:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get upcoming doctor appointments (not completed)"
    statement: "SELECT * FROM doctor_appointment_reminders WHERE user_id = $1 AND is_completed = false ORDER BY appointment_datetime"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get upcoming doctor appointments for"

  get_workout_reminders:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get workout reminders for the user"
    statement: "SELECT * FROM workout_reminders WHERE user_id = $1 ORDER BY workout_datetime"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get workout reminders for"

  get_pending_workout_reminders:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get pending (not completed) workout reminders"
    statement: "SELECT * FROM workout_reminders WHERE user_id = $1 AND is_completed = false ORDER BY workout_datetime"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get pending workout reminders for"

  get_upcoming_reminders:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get all upcoming reminders for the next 24 hours"
    statement: "SELECT 'medication' as reminder_type, name as title, schedule_datetime as reminder_time, dosage as details FROM medication_reminders WHERE user_id = $1 AND is_taken = false AND schedule_datetime >= NOW() AND schedule_datetime <= NOW() + INTERVAL '1 day' UNION ALL SELECT 'bp_check' as reminder_type, 'Blood Pressure Check' as title, reminder_datetime as reminder_time, bp_category as details FROM bp_check_reminders WHERE user_id = $1 AND is_completed = false AND reminder_datetime >= NOW() AND reminder_datetime <= NOW() + INTERVAL '1 day' UNION ALL SELECT 'doctor_appointment' as reminder_type, doctor_name as title, appointment_datetime as reminder_time, appointment_type as details FROM doctor_appointment_reminders WHERE user_id = $1 AND is_completed = false AND appointment_datetime >= NOW() AND appointment_datetime <= NOW() + INTERVAL '1 day' UNION ALL SELECT 'workout' as reminder_type, workout_type as title, workout_datetime as reminder_time, duration_minutes || ' minutes' as details FROM workout_reminders WHERE user_id = $1 AND is_completed = false AND workout_datetime >= NOW() AND workout_datetime <= NOW() + INTERVAL '1 day' ORDER BY reminder_time"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get upcoming reminders for"

  get_bp_statistics:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get blood pressure statistics and trends for health analysis"
    statement: "SELECT COUNT(*) as total_readings, AVG(systolic::float) as avg_systolic, AVG(diastolic::float) as avg_diastolic, AVG(pulse::float) as avg_pulse, MIN(reading_time) as first_reading, MAX(reading_time) as latest_reading FROM blood_pressure_readings WHERE user_id = $1"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get BP statistics for"

  get_recent_medication_activity:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get recent medication reminder activity and adherence"
    statement: "SELECT name, schedule_datetime, is_taken, created_at FROM medication_reminders WHERE user_id = $1 ORDER BY created_at DESC LIMIT 10"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get recent medication activity for"

  get_medication_adherence:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get medication adherence statistics"
    statement: "SELECT name, COUNT(*) as total_doses, SUM(CASE WHEN is_taken = true THEN 1 ELSE 0 END) as taken_doses, SUM(CASE WHEN is_taken = true THEN 1 ELSE 0 END)::float / COUNT(*) * 100 as adherence_percentage FROM medication_reminders WHERE user_id = $1 GROUP BY name"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get medication adherence for"

  get_health_summary:
    kind: "postgres-sql"
    source: "my-sql-db"
    description: "Get comprehensive health summary with recent activities"
    statement: "SELECT 'bp_readings' as activity_type, COUNT(*) as count, MAX(reading_time) as last_activity FROM blood_pressure_readings WHERE user_id = $1 UNION ALL SELECT 'medications_taken' as activity_type, SUM(CASE WHEN is_taken = true THEN 1 ELSE 0 END) as count, MAX(schedule_datetime) as last_activity FROM medication_reminders WHERE user_id = $1 UNION ALL SELECT 'bp_checks_completed' as activity_type, SUM(CASE WHEN is_completed = true THEN 1 ELSE 0 END) as count, MAX(reminder_datetime) as last_activity FROM bp_check_reminders WHERE user_id = $1 UNION ALL SELECT 'workouts_completed' as activity_type, SUM(CASE WHEN is_completed = true THEN 1 ELSE 0 END) as count, MAX(workout_datetime) as last_activity FROM workout_reminders WHERE user_id = $1"
    parameters:
      - name: "user_id"
        type: "integer"
        description: "The ID of the user to get health summary for"

toolsets:
    my_toolset:
        # User Profile
        - get_user_profile

        # Blood Pressure
        - get_bp_history
        - get_recent_bp_readings
        - get_bp_statistics

        # Medication Reminders
        - get_medication_reminders
        - get_pending_medication_reminders
        - get_recent_medication_activity
        - get_medication_adherence

        # BP Check Reminders
        - get_bp_check_reminders
        - get_pending_bp_check_reminders

        # Doctor Appointments
        - get_doctor_appointment_reminders
        - get_upcoming_doctor_appointments

        # Workout Reminders
        - get_workout_reminders
        - get_pending_workout_reminders

        # Combined Views
        - get_upcoming_reminders
        - get_health_summary
